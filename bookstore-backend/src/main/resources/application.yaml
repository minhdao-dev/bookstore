spring:
  application:
    name: bookstore-backend
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB
app:
  jwt:
    secret: ${JWT_SECRET:this-is-a-dev-only-placeholder-secret-change-me-32chars+}
    expiration-ms: 1800000
vnpay:
  tmn-code: ${VNPAY_TMN_CODE:changeme}
  hash-secret: ${VNPAY_HASH_SECRET:changeme}
  pay-url: https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
  return-url: ${VNPAY_RETURN_URL:http://localhost:8080/api/payment/vnpay/return}
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket: bookstore-content
  presigned-url-expiry-minutes: 10