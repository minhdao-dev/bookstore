spring:
  application:
    name: bookstore-backend
  data:
    redis:
      repositories:
        enabled: false
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB
  mvc:
    problemdetails:
      enabled: true
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:false}
          starttls:
            enable: ${SMTP_STARTTLS:false}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
logging:
  pattern:
    console: "%clr(%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX}){faint} %clr(%5p) %clr([%X{correlationId:-'-'}]){yellow} %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n${LOG_EXCEPTION_CONVERSION_WORD:-%wEx}"
  file:
    name: ${LOG_FILE_PATH:./logs/app.log}
  structured:
    format:
      file: logstash
app:
  jwt:
    secret: ${JWT_SECRET:this-is-a-dev-only-placeholder-secret-change-me-32chars+}
    expiration-ms: 900000
    refresh-token-expiration-days: 7
    issuer: bookstore-backend
    audience: bookstore-client
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}
notification:
  from-address: ${MAIL_FROM_ADDRESS:no-reply@vanthucac.dev}
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
  email-verification-expiration-hours: 24
  password-reset-expiration-minutes: 30
order:
  expiry:
    pending-payment-ttl-minutes: 30
rate-limit:
  auth-capacity: 10
  auth-refill-tokens: 10
  auth-refill-period-seconds: 60
  content-capacity: 60
  content-refill-tokens: 60
  content-refill-period-seconds: 60
vnpay:
  tmn-code: ${VNPAY_TMN_CODE:changeme}
  hash-secret: ${VNPAY_HASH_SECRET:changeme}
  pay-url: https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
  return-url: ${VNPAY_RETURN_URL:http://localhost:5173/payment/vnpay-return}
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket: bookstore-content
  presigned-url-expiry-minutes: 10
ghn:
  token: ${GHN_TOKEN:changeme}
  shop-id: ${GHN_SHOP_ID:changeme}
  base-url: https://dev-online-gateway.ghn.vn/shiip/public-api
  default-service-type-id: 2
  webhook-secret: ${GHN_WEBHOOK_SECRET:changeme}
catalog:
  search-provider: elasticsearch
ffmpeg:
  path: ${FFMPEG_PATH:ffmpeg}
  segment-duration-seconds: 10
  audio-bitrate: 128k
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    mail:
      enabled: false