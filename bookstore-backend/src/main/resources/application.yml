spring:
  application:
    name: bookstore-backend
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB
  mvc:
    problemdetails:
      enabled: true
  mail:
    host: ${SMTP_HOST:sandbox.smtp.mailtrap.io}
    port: ${SMTP_PORT:2525}
    username: ${SMTP_USERNAME:changeme}
    password: ${SMTP_PASSWORD:changeme}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
app:
  jwt:
    secret: ${JWT_SECRET:this-is-a-dev-only-placeholder-secret-change-me-32chars+}
    expiration-ms: 900000
    refresh-token-expiration-days: 7
    issuer: bookstore-backend
    audience: bookstore-client
notification:
  from-address: ${MAIL_FROM_ADDRESS:no-reply@vanthucac.dev}
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
  email-verification-expiration-hours: 24
  password-reset-expiration-minutes: 30
vnpay:
  tmn-code: ${VNPAY_TMN_CODE:changeme}
  hash-secret: ${VNPAY_HASH_SECRET:changeme}
  pay-url: https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
  return-url: ${VNPAY_RETURN_URL:http://localhost:5173/payment/vnpay-return}
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket: bookstore-content
  presigned-url-expiry-minutes: 10
ghn:
  token: ${GHN_TOKEN:changeme}
  shop-id: ${GHN_SHOP_ID:changeme}
  base-url: https://dev-online-gateway.ghn.vn/shiip/public-api
  default-service-type-id: 2
  webhook-secret: ${GHN_WEBHOOK_SECRET:changeme}
catalog:
  search-provider: elasticsearch
ffmpeg:
  path: ${FFMPEG_PATH:ffmpeg}
  segment-duration-seconds: 10
  audio-bitrate: 128k